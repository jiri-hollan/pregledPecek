<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-size:13px;background:#dedad4;padding:14px;color:#111}
.tabs{display:flex;max-width:840px;margin:0 auto;border-bottom:2px solid #1a4a7a}
.tab{padding:9px 24px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #ccc;border-bottom:none;background:#e8e6e0;color:#555;border-radius:4px 4px 0 0;margin-right:3px}
.tab.active{background:#fff;color:#1a4a7a;border-color:#1a4a7a;border-bottom:2px solid #fff;margin-bottom:-2px}
.tc{display:none;max-width:840px;margin:0 auto}.tc.active{display:block}
.toolbar{display:flex;gap:8px;padding:10px 0;flex-wrap:wrap;align-items:center}
.btn{padding:8px 16px;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:5px;transition:opacity .15s}
.btn:hover{opacity:.82}
.bp{background:#1a4a7a;color:#fff}.bi{background:#fff;color:#1a4a7a;border:1.5px solid #1a4a7a}
.br{background:#fff;color:#c8102e;border:1.5px solid #c8102e}.bv{background:#fff;color:#333;border:1.5px solid #888}
.st{font-size:12px;color:#555;font-style:italic}

/* ── INPUT FORM (modra) ── */
.paper{background:#e8f2fb;border:1px solid #a0c4e8;box-shadow:0 3px 16px rgba(0,0,0,.16)}
.hdr{display:flex;border-bottom:2px solid #000;background:#fff}
.hdr-logo{width:136px;min-width:136px;border-right:1px solid #000;padding:7px 8px;display:flex;align-items:center;gap:6px;background:#fff;overflow:hidden}
.hdr-title{flex:1;display:flex;align-items:center;justify-content:center;background:#fff}
.hdr-title h1{font-size:19px;font-weight:900;letter-spacing:.05em;color:#000}
.meta-row{display:flex;border-bottom:1px solid #8ab8d8;background:#e8f2fb}
.meta-left{flex:1;padding:5px 10px;border-right:1px solid #8ab8d8;display:flex;flex-direction:column;gap:5px}
.meta-right{width:240px;padding:5px 10px;display:flex;flex-direction:column;gap:4px}
.mf{display:flex;align-items:baseline;gap:5px}
.mf label{font-size:11px;white-space:nowrap;min-width:88px;color:#1a4a7a;font-weight:700}
.mf input{flex:1;background:#fff;border:1px solid #8ab8d8;border-radius:2px;font-size:12px;font-family:inherit;outline:none;padding:2px 5px;color:#111;font-weight:600}
.mf input:focus{border-color:#1a4a7a;box-shadow:0 0 0 2px rgba(26,74,122,.12)}
.mf-pair{display:flex;gap:4px;align-items:baseline}
.mf-pair label{font-size:11px;white-space:nowrap;color:#1a4a7a;font-weight:700}
.mf-pair input{flex:1;background:#fff;border:1px solid #8ab8d8;border-radius:2px;font-size:12px;font-family:inherit;outline:none;padding:2px 5px;color:#111;min-width:0;font-weight:600}
.fl{display:flex;align-items:baseline;gap:6px;padding:4px 10px;border-bottom:1px solid #c0d8ec;background:#e8f2fb}
.fl label{font-size:12px;white-space:nowrap;min-width:148px;color:#1a4a7a;font-weight:700}
.fl input{flex:1;background:#fff;border:1px solid #8ab8d8;border-radius:2px;font-size:13px;font-family:inherit;outline:none;padding:2px 5px;color:#111;font-weight:600}
.mr{display:flex;border-bottom:1px solid #c0d8ec;border-top:1px solid #c0d8ec;background:#e8f2fb}
.mc{display:flex;flex-direction:column;padding:4px 6px;border-right:1px solid #c0d8ec;flex:1;min-width:0}.mc:last-child{border-right:none}
.mc label{font-size:10px;font-weight:700;color:#0d3a6e;letter-spacing:.03em;white-space:nowrap;margin-bottom:2px}
.mc-r{display:flex;align-items:center;gap:2px}
.mc input{width:100%;background:#fff;border:1px solid #8ab8d8;border-radius:2px;font-size:13px;font-family:inherit;outline:none;padding:2px 3px;color:#111;font-weight:700}
.mc input.cp{color:#0a5c2e;background:#edfaf3;border-color:#aaccaa;font-weight:700}
.mc .u{font-size:10px;color:#0d3a6e;white-space:nowrap;font-weight:700}
.lr{display:flex;border-bottom:1px solid #c0d8ec;background:#e8f2fb}
.lc{display:flex;flex-direction:column;padding:4px 6px;border-right:1px solid #c0d8ec;flex:1;min-width:0}.lc:last-child{border-right:none}
.lc label{font-size:10px;font-weight:700;color:#0d3a6e;margin-bottom:2px}
.lc input{width:100%;background:#fff;border:1px solid #8ab8d8;border-radius:2px;font-size:13px;font-family:inherit;outline:none;padding:2px 3px;color:#111;font-weight:700}
.ar{display:flex;border-bottom:1px solid #c0d8ec;background:#e8f2fb}
.ac{display:flex;align-items:baseline;gap:5px;padding:4px 8px;border-right:1px solid #c0d8ec;flex:1}.ac:last-child{border-right:none}
.ac label{font-size:12px;white-space:nowrap;color:#1a4a7a;font-weight:700}
.ac select,.ac input{flex:1;background:#fff;border:1px solid #8ab8d8;border-radius:2px;font-size:13px;font-family:inherit;outline:none;padding:2px 4px;min-width:40px;color:#111;font-weight:600}
.alg{display:flex;align-items:baseline;gap:6px;padding:5px 10px;border-bottom:2px solid #c8102e;background:#fff5f5}
.alg label{font-size:12px;font-weight:700;white-space:nowrap;min-width:72px;color:#c8102e}
.alg input{flex:1;background:#fff;border:1.5px solid #c8102e;border-radius:2px;font-size:13px;font-family:inherit;outline:none;padding:2px 5px;font-weight:700;color:#111}
.ta{padding:4px 10px 3px;border-bottom:1px solid #c0d8ec;background:#e8f2fb}
.ta label{font-size:12px;font-weight:700;color:#1a4a7a;display:block;margin-bottom:2px}
.ta textarea{width:100%;background:#fff;border:1px solid #8ab8d8;border-radius:2px;font-size:13px;font-family:inherit;outline:none;padding:3px 5px;line-height:1.5;color:#111;overflow:hidden;resize:none;font-weight:600}
.sk{display:flex;align-items:baseline;gap:6px;padding:5px 10px;border-bottom:1px solid #c0d8ec;background:#e8f2fb}
.sk label{font-size:12px;font-weight:700;white-space:nowrap;min-width:56px;color:#000}
.sk input{flex:1;background:#fff;border:1px solid #8ab8d8;border-radius:2px;font-size:13px;font-family:inherit;outline:none;padding:2px 5px;color:#111;font-weight:600}
.pw{display:flex;border-bottom:1px solid #c0d8ec;background:#e8f2fb}
.pl{flex:1;border-right:1px solid #c0d8ec}.pr{flex:1}
.ph{font-size:10px;font-weight:700;letter-spacing:.1em;text-align:center;padding:3px;border-bottom:1px solid #c0d8ec;background:#d0e6f5;text-transform:uppercase;color:#1a4a7a}
.pb{padding:5px 10px;display:flex;align-items:stretch}
.pb textarea{flex:1;background:#fff;border:1px solid #8ab8d8;border-radius:2px;font-size:13px;font-family:inherit;outline:none;padding:3px 5px;resize:none;overflow:hidden;line-height:1.5;color:#111;min-height:32px;font-weight:600}
.fb{display:flex;border-top:2px solid #000;background:#d0e6f5}
.fc{flex:1;padding:3px 7px;border-right:1px solid #8ab8d8;font-size:9px}.fc:last-child{border-right:none}
.fc small{display:block;font-size:8px;color:#1a4a7a;font-weight:700}
.fc strong{display:block;font-size:9px;font-weight:700;color:#000}

/* ── PRINT LAYOUT (hidden, used for PDF rendering) ── */
#printArea{
  position:fixed;left:-9999px;top:0;
  width:794px;          /* A4 at 96dpi = 210mm */
  min-height:1123px;    /* A4 height: 297mm at 96dpi */
  background:#fff;
  font-family:'Segoe UI',Tahoma,Arial,sans-serif;
  font-size:20px;       /* 2x base (was 10px) */
  color:#000;
  line-height:1.3;
  display:flex;
  flex-direction:column;
}
/* ── NOVA GLAVA (po predlogi SB Izola) ── */
#printArea .ph2{display:flex;align-items:flex-start;padding:8px 6px 4px 6px;gap:10px}
#printArea .ph2-left{display:flex;align-items:flex-start;gap:8px;width:225px;min-width:225px}
#printArea .ph2-glyph{height:78px;width:auto;display:block}
#printArea .ph2-sb{font-size:12px;font-weight:700;letter-spacing:.42em;line-height:1.55;color:#000;text-transform:uppercase}
#printArea .ph2-it{font-size:10px;font-style:italic;letter-spacing:.38em;line-height:1.5;color:#777;text-transform:uppercase;margin-top:3px}
#printArea .ph2-title{flex:1;text-align:center;font-size:29px;font-weight:600;padding-top:8px;color:#000}
#printArea .ph2-box{width:255px;min-width:255px;border:2.5px solid #000;padding:6px 10px;display:flex;flex-direction:column;gap:4px;background:#fff}
#printArea .ph2-row{display:flex;align-items:baseline;gap:6px;border-bottom:1px solid #ddd;padding:2px 0}
#printArea .ph2-row:last-child{border-bottom:none}
#printArea .ph2-row .l{font-size:12px;font-weight:700;color:#555;white-space:nowrap;min-width:105px}
#printArea .ph2-row .v{font-size:17px;font-weight:700;color:#000}
#printArea .ph2-sub{display:flex;align-items:center;gap:10px;padding:2px 6px 7px 6px}
#printArea .ph2-dt{border:1.5px solid #000;padding:3px 10px;font-size:15px;font-weight:700}
#printArea .ph2-odd{display:flex;align-items:baseline;gap:6px}
#printArea .ph2-odd .l{font-size:13px;font-weight:700;color:#000}
#printArea .ph2-odd .v{border:1.5px solid #000;padding:3px 10px;font-size:15px;font-weight:700;min-width:170px;min-height:20px}
#printArea .ph-hdr{display:flex;border:2px solid #000;border-bottom:4px solid #000}
#printArea .ph-logo{width:140px;min-width:140px;border-right:2px solid #000;padding:7px 8px;display:flex;align-items:center;gap:5px;overflow:hidden}
#printArea .ph-title{flex:1;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;letter-spacing:.05em}
#printArea .ph-meta{display:flex;border:1.5px solid #000;border-top:none}
#printArea .ph-ml{flex:1;padding:6px 10px;border-right:1.5px solid #000;display:flex;flex-direction:column;gap:6px}
#printArea .ph-mr{width:280px;padding:6px 10px;display:flex;flex-direction:column;gap:5px}
#printArea .pf{display:flex;align-items:baseline;gap:6px;border-bottom:1px solid #e0e0e0;padding:3px 0}
#printArea .pf:last-child{border-bottom:none}
#printArea .pfl{font-size:13px;font-weight:700;color:#555;white-space:nowrap;min-width:46px}
#printArea .pfv{font-size:17px;font-weight:600;color:#000}
#printArea .ph-ml .pfl{min-width:120px}
#printArea .ph-ml .pfv{flex:1}
#printArea .prow{display:flex;border:1.5px solid #000;border-top:none}
#printArea .pcell{flex:1;padding:5px 7px;border-right:1px solid #ccc;font-size:15px}
#printArea .pcell:last-child{border-right:none}
#printArea .pcell .lbl{font-size:12px;font-weight:700;color:#666;display:block}

  document.querySelectorAll('.tc').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+n).classList.add('active');
}
const g=id=>{const e=document.getElementById(id);return e?e.value.trim():'';}
const p=(id,v)=>{const e=document.getElementById(id);if(e){e.value=v;if(e.tagName==='TEXTAREA')autoGrow(e);}}
const ss=(m,d=3000)=>{['st','st2'].forEach(id=>{const e=document.getElementById(id);if(e){e.textContent=m;if(d)setTimeout(()=>e.textContent='',d);}});}

function autoGrow(el){el.style.height='auto';el.style.height=el.scrollHeight+'px';}
function autoGrowAll(){document.querySelectorAll('textarea').forEach(autoGrow);}

function calc(){
  const dob=document.getElementById('datum_rojstva').value;
  if(dob){const a=Math.floor((new Date()-new Date(dob))/(365.25*864e5));if(a>0&&a<120){const e=document.getElementById('starost');if(e)e.value=a;}}
  const t=parseFloat(g('teza')),h=parseFloat(g('visina'));
  if(t>0&&h>0.3){const e=document.getElementById('bmi');if(e)e.value=(t/(h*h)).toFixed(1);}
}

const FLD=['datum_cas','maticna','priimek','ime','datum_rojstva','oddelek','op_diagnoza','nacrtovana_op',
  'starost','teza','visina','bmi','tlak_s','tlak_d','pulz','spo2',
  'hb','ks','inr','aptc','trombociti','kreatinin','drugi_izvidi','ekg',
  'asa','mallampati','opiati','druge_odvisnosti','alergija','rtg',
  'pridružene_bolezni','predhodna_terapija','izvidi','sklep',
  'premedikacija','navodila','ordiniral'];

const getFD=()=>{const d={};FLD.forEach(f=>d[f]=g(f));return d;}
const setFD=d=>{
  FLD.forEach(f=>{if(d[f]!==undefined)p(f,d[f]);});
  if(d.priimek_ime&&!d.priimek){const pts=(d.priimek_ime||'').split(' ');p('priimek',pts[0]||'');p('ime',pts.slice(1).join(' ')||'');}
  if((d.premedikacija_vecer||d.premedikacija_pred_op)&&!d.premedikacija)
    p('premedikacija',[(d.premedikacija_vecer||''),(d.premedikacija_pred_op||'')].filter(Boolean).join('\n'));
  setTimeout(autoGrowAll,50);
};
function pickVal(sel, targetId){
  const val=sel.value;
  if(val){document.getElementById(targetId).value=val;sel.value='';}
}
function sklepSel(sel){
  const val=sel.value;
  if(val){
    document.getElementById('sklep').value=val;
    sel.value=''; // reset dropdown so user can re-select same
  }
}
function resetF(){
  if(!confirm('Počistiti vse vnose? (ime zdravnika ostane)'))return;
  FLD.forEach(f=>{
    if(f==='ordiniral')return; // zdravnik ostane čez dan
    const e=document.getElementById(f);if(e){e.value='';if(f==='opiati')e.value='ne';}
  });
  const sel=document.getElementById('sklep_sel');if(sel)sel.value='';
  autoGrowAll();ss('Obrazec počiščen.');
}
function saveDoctor(){
  try{localStorage.setItem('anest_doctor', g('ordiniral'));}catch(e){}
}
function loadDoctor(){
  try{
    const saved=localStorage.getItem('anest_doctor');
    if(saved)p('ordiniral',saved);
  }catch(e){}
}
loadDoctor();
function fileName(){
  const pr=(g('priimek')||'bolnik').replace(/\s+/g,'');
  const im=(g('ime')||'').replace(/\s+/g,'');
  const dt=(g('datum_rojstva')||'').replace(/-/g,'');
  const base=im?`${pr}_${im}`:pr;
  return dt?`${base}_${dt}.pdf`:`${base}.pdf`;
}

function fmtDate(iso){
  if(!iso)return '';
  const p=iso.split('-');
  if(p.length===3)return p[2]+'.'+p[1]+'.'+p[0];
  return iso;
}
function fmtDT(iso){
  if(!iso)return '';
  const [d,t]=iso.split('T');
  const dp=d.split('-');
  const date=dp.length===3?dp[2]+'.'+dp[1]+'.'+dp[0]:d;
  return t?date+' '+t:date;
}

// ── GENERATE PDF via html2canvas ──────────────────────────
// ── Auto-shrink "Izvid in opombe" text if it overflows one A4 page ──
function fitIzvidiToPage(){
  const el=document.getElementById('printArea');
  el.style.left='0';el.style.top='0';el.style.position='absolute';el.style.zIndex='-1';
  const growVal=el.querySelector('.pblock.grow .val');
  if(!growVal){el.style.left='-9999px';el.style.position='fixed';return;}
  let fontSize=19; // začetna/maksimalna velikost: 19px ≈ 14pt na A4; ob več teksta se samodejno zmanjša
  growVal.style.fontSize=fontSize+'px';
  const A4_HEIGHT_PX=1123;
  let guard=0;
  while(el.scrollHeight>A4_HEIGHT_PX+2 && fontSize>11 && guard<30){
    fontSize-=1;
    growVal.style.fontSize=fontSize+'px';
    guard++;
  }
  el.style.left='-9999px';el.style.position='fixed';
}

async function genPDF(){
  ss('Generiram PDF...', 0);
  try{
    buildPrintArea();
    fitIzvidiToPage();
    const el=document.getElementById('printArea');
    // temporarily make visible for rendering
    el.style.left='0';el.style.top='0';el.style.position='absolute';
    el.style.zIndex='-1';

    await new Promise(r=>setTimeout(r,100)); // let layout settle

    const canvas=await html2canvas(el,{
      scale:3,          // 3x for sharp text = 2382px wide
      useCORS:true,
      backgroundColor:'#ffffff',
      logging:false,
      width:794,
      height:Math.max(1123, el.scrollHeight),  // at least A4
      windowWidth:810,
      windowHeight:Math.max(1123, el.scrollHeight)
    });

    el.style.left='-9999px';el.style.position='fixed';

    const{jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const W=210, PH=297;
    const imgData=canvas.toDataURL('image/jpeg',0.93);
    // Always fill entire A4 page (content has min-height:1123px = A4)
    const pxPerMm=canvas.width/W;  // px per mm
    const pageHeightPx=PH*pxPerMm; // how many px = one A4 page

    if(canvas.height<=pageHeightPx*1.05){
      // Single page - stretch to full A4
      doc.addImage(imgData,'JPEG',0,0,W,PH);
    } else {
      // Multi-page
      let yOff=0;
      while(yOff<canvas.height){
        if(yOff>0)doc.addPage();
        const sliceH=Math.min(pageHeightPx, canvas.height-yOff);
        const sliceCanvas=document.createElement('canvas');
        sliceCanvas.width=canvas.width;sliceCanvas.height=Math.ceil(pageHeightPx);
        const ctx=sliceCanvas.getContext('2d');
        ctx.fillStyle='#ffffff';ctx.fillRect(0,0,sliceCanvas.width,sliceCanvas.height);
        ctx.drawImage(canvas,0,-yOff);
        doc.addImage(sliceCanvas.toDataURL('image/jpeg',0.93),'JPEG',0,0,W,PH);
        yOff+=sliceH;
      }
    }

    doc.setProperties({subject:'ANEST_DATA:'+JSON.stringify(getFD()),title:'Anesteziološki pregled'});

    // ── Vprašaj za lokacijo shranjevanja (File System Access API) ──
    if(window.showSaveFilePicker){
      try{
        const handle=await window.showSaveFilePicker({
          suggestedName:fileName(),
          types:[{description:'PDF dokument',accept:{'application/pdf':['.pdf']}}]
        });
        const writable=await handle.createWritable();
        await writable.write(doc.output('blob'));
        await writable.close();
        ss('✓ Shranjeno: '+handle.name);
      }catch(err){
        if(err.name==='AbortError'){ss('Shranjevanje preklicano.');}
        else{doc.save(fileName());ss('✓ Shranjeno (prenosi): '+fileName());}
      }
    }else{
      // Firefox/Safari ne podpirata izbire lokacije — običajen prenos
      doc.save(fileName());
      ss('✓ Shranjeno v Prenosi: '+fileName());
    }
  }catch(e){ss('Napaka: '+e.message);}
}

async function bldPrev(){
  ss('Generiram...', 0);
  try{
    buildPrintArea();
    fitIzvidiToPage();
    const el=document.getElementById('printArea');
    el.style.left='0';el.style.top='0';el.style.position='absolute';el.style.zIndex='-1';
    await new Promise(r=>setTimeout(r,100));

    const canvas=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false,width:794,height:Math.max(1123,el.scrollHeight),windowWidth:810,windowHeight:Math.max(1123,el.scrollHeight)});
    el.style.left='-9999px';el.style.position='fixed';

    const h=document.getElementById('ch');
    h.innerHTML='';
    const img=document.createElement('img');
    img.src=canvas.toDataURL('image/jpeg',0.9);
    img.style.cssText='max-width:100%;border:1px solid #aaa;box-shadow:0 4px 20px rgba(0,0,0,.2);display:block;margin:0 auto';
    h.appendChild(img);
    ss('Predogled posodobljen.');
  }catch(e){
    document.getElementById('ch').innerHTML='<div style="color:red;padding:20px">Napaka: '+e.message+'</div>';
  }
}

function impPDF(input){
  const file=input.files[0];if(!file)return;ss('Uvažam...',0);
  const go=()=>{
    const r=new FileReader();
    r.onload=ev=>{
      window.pdfjsLib.getDocument({data:new Uint8Array(ev.target.result)}).promise.then(pdf=>{
        pdf.getMetadata().then(meta=>{
          const subj=meta?.info?.Subject||'';
          if(subj.startsWith('ANEST_DATA:')){
            try{const d=JSON.parse(subj.replace('ANEST_DATA:',''));setFD(d);calc();ss('✓ Uvoženo.');}
            catch{ss('Napaka JSON.');}
          }else ss('PDF ne vsebuje uvoznih podatkov.',5000);
        });
      }).catch(()=>ss('Napaka pri branju.'));
    };r.readAsArrayBuffer(file);
  };
  if(!window.pdfjsLib){
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';go();};
    document.head.appendChild(sc);
  }else go();
  input.value='';
}
</script></body></html>
